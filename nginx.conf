# nginx config for the static Astro build (build.format: 'file' in astro.config.mjs,
# so routes are served as e.g. services.html but reachable at the clean URL
# /services). See Docs/SEO_phase1_prod_changes_pending.md for what still needs
# to change on this file when the site goes to production.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Canonical/OG tags are built with no trailing slash (src/lib/seo.ts,
    # trailingSlash: 'never' in astro.config.mjs). Keep nginx from rewriting
    # URLs against the Host header so that contract holds behind any proxy too.
    absolute_redirect off;

    # Enforce the no-trailing-slash canonical form: "/services/" -> "/services".
    # Skip the bare root, which has no non-slash form.
    rewrite ^/(.+)/$ /$1 permanent;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;
    gzip_min_length 256;

    # Hashed, content-addressed build assets: cache forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML responses change on every deploy and have no hash in the filename:
    # never let a stale page get served from a shared cache.
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # No `=200` override: the response keeps status 404, as required by the
    # plan's verification step (`curl -I /does-not-exist` -> 404).
    error_page 404 /404.html;
}
