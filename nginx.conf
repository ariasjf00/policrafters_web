# nginx config for the static Astro build (build.format: 'file' in astro.config.mjs,
# so routes are served as e.g. services.html but reachable at the clean URL
# /services). See Docs/SEO_phase1_prod_changes_pending.md and
# Docs/SEO_phase2_prod_changes_pending.md for what still needs to change on
# this file when the site goes to production.

# --- SEO Phase 2: legacy `?lang=` query param -> route-based i18n -------
# Before Phase 2, language was a `?lang=` query param on a single set of
# routes; now English is unprefixed and Spanish lives under /es (see
# src/lib/i18n.ts). These `map`s compute, for any request, the query string
# with `lang` removed and the request's path rewritten into the other
# language, so a handful of `if`s below can redirect old links/bookmarks to
# their new canonical URL. http-context directives (`map`), so they must sit
# outside `server {}` — this file is `include`d directly inside nginx's
# `http {}` block (see Dockerfile).

# $uri with any "/es" prefix stripped ("/es/services" -> "/services",
# "/es" -> "/", anything else unchanged).
map $uri $bare_path {
    default         $uri;
    "~^/es$"        "/";
    "~^/es(/.*)$"   "$1";
}

# The Spanish path for $bare_path ("/" -> "/es", "/services" -> "/es/services").
map $bare_path $es_path {
    "/"       "/es";
    default   "/es$bare_path";
}

# $args with the `lang` param removed, wherever it sits among other params.
# Handles the common cases (lang alone, lang first, lang last, lang in the
# middle of exactly two neighbours) — real traffic here is at most `lang`
# plus one other param (e.g. collections' `?category=`).
map $args $args_no_lang {
    default                              "$args";
    "~^lang=[^&]*$"                      "";
    "~^lang=[^&]*&(?<r>.*)$"             "$r";
    "~^(?<r>.*)&lang=[^&]*$"             "$r";
    "~^(?<r1>.*)&lang=[^&]*&(?<r2>.*)$"  "$r1&$r2";
}

# A leading "?" only when there's something left to carry over.
map $args_no_lang $qs_no_lang {
    default   "?$args_no_lang";
    ""        "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Canonical/OG tags are built with no trailing slash (src/lib/seo.ts,
    # trailingSlash: 'never' in astro.config.mjs). Keep nginx from rewriting
    # URLs against the Host header so that contract holds behind any proxy too.
    absolute_redirect off;

    # Legacy `?lang=es` / `?lang=en` URLs redirect to their new canonical
    # address, with every other query param preserved and `lang` dropped.
    # Each only fires when the request isn't already canonical, so it can't loop:
    #   /services?lang=es                    -> /es/services
    #   /?lang=es                            -> /es
    #   /collections?category=pivot&lang=es  -> /es/collections?category=pivot
    #   /services?lang=en                    -> /services
    #   /es/services?lang=es                 -> /es/services
    #   /es/services?lang=en                 -> /services
    if ($arg_lang = es) {
        rewrite ^ $es_path$qs_no_lang permanent;
    }
    if ($arg_lang = en) {
        rewrite ^ $bare_path$qs_no_lang permanent;
    }

    # Enforce the no-trailing-slash canonical form: "/services/" -> "/services"
    # (this also covers "/es/" -> "/es"). Skip the bare root, which has no
    # non-slash form.
    rewrite ^/(.+)/$ /$1 permanent;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;
    gzip_min_length 256;

    # Hashed, content-addressed build assets: cache forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML responses change on every deploy and have no hash in the filename:
    # never let a stale page get served from a shared cache.
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # No `=200` override: the response keeps status 404, as required by the
    # plan's verification step (`curl -I /does-not-exist` -> 404). Routed
    # through a named location so the Spanish 404 (src/pages/es/404.astro)
    # serves under /es/*, and the English one (src/pages/404.astro) everywhere
    # else — error_page preserves $request_uri, so that's what decides it.
    error_page 404 @error404;

    location @error404 {
        if ($request_uri ~ "^/es(/|$|\?)") {
            rewrite ^ /es/404.html break;
        }
        rewrite ^ /404.html break;
    }
}
